<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raise Ticket - AI Helpdesk</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="ticket-page">

    <div class="container">

        <h1>Raise Ticket</h1>

        <input
            type="text"
            id="title"
            placeholder="Ticket Title"
        >

        <textarea
            id="description"
            placeholder="Describe your issue"
        ></textarea>

        <button id="submitTicket">
            Submit Ticket
        </button>

    </div>


    <script type="module" src="js/script.js"></script>

</body>

</html>
